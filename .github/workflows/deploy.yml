name: CD - Déploiement vers Hugging Face Space

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code du dépôt GitHub
        uses: actions/checkout@v4

      - name: ⚙️ Installer Git LFS (pour les fichiers de modèle)
        run: |
          git lfs install

      - name: 🚀 Déployer vers le Space Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          echo "Clonage du Space Hugging Face..."
          git clone https://huggingface.co/spaces/${HF_SPACE_ID} space_repo

          echo "Copie des fichiers du dépôt GitHub vers le Space..."
          # On se place à la racine de TON dépôt (déjà là) et on copie vers space_repo/
          rsync -av --delete ./ space_repo/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'space_repo'

          cd space_repo

          echo "Configuration de Git pour le commit automatique..."
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "Vérification des changements..."
          if ! git diff --quiet; then
            git add .
            git commit -m "Déploiement automatique depuis GitHub Actions (branche main)"
            git push https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git
          else:
            echo "Aucun changement à déployer."
          fi

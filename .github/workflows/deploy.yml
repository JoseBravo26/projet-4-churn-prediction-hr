name: Deploy to Hugging Face Space

on:
  push:
    branches: [ main , develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Git LFS
        run: |
          git lfs install

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          echo "Clonando Space..."
          git clone https://huggingface.co/spaces/${HF_SPACE_ID} space_repo
          cd space_repo

          echo "Copiando archivos del proyecto..."
          # ajusta la ruta si tu código está en un subdirectorio
          rsync -av --delete ../ . \
            --exclude '.git' \
            --exclude '.github'

          echo "Configurando Git..."
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git status
          if ! git diff --quiet; then
            git add .
            git commit -m "Auto-deploy from GitHub Actions"
            git push https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}.git
          else
            echo "No hay cambios para desplegar"
          fi
